# Integration crate: copy/construction/install ordering via injected ports.
# Owner lane N. Allowed first-party dependencies: copy-contract, repo-contract,
# family-model, family-store-contract
# (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md §2).
[package]
name = "gwz-workspace-install"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "An internal component crate of GWZ's local clone: destination construction and installation ordering."
repository = "https://github.com/owebeeone/gwz-core"
readme = "README.md"
keywords = ["gwz", "git", "workspace", "internal"]

[lib]
path = "src/lib.rs"

[features]
# The recording install-port fake for consumers (core Tier B slices).
test-support = []

[dependencies]
gwz-copy-contract = { path = "../copy-contract", version = "0.0.1" }
gwz-family-model = { path = "../family-model", version = "0.0.1" }
gwz-family-store-contract = { path = "../family-store-contract", version = "0.0.1" }
gwz-repo-contract = { path = "../repo-contract", version = "0.0.1" }

[dev-dependencies]
gwz-copy-contract = { path = "../copy-contract", features = ["contract-tests"] }
gwz-family-store-contract = { path = "../family-store-contract", features = ["contract-tests"] }
