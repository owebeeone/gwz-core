# Contract crate: tree-copy request/result/error types, the cancellation port
# and the `TreeCopier` trait. Owner lane C (interface owner). Allowed
# first-party dependencies: none (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md §2).
[package]
name = "gwz-copy-contract"
version = "0.0.3"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "An internal component crate of GWZ's local clone: tree-copy contract (no platform implementation)."
repository = "https://github.com/owebeeone/gwz-core"
readme = "README.md"
keywords = ["gwz", "git", "workspace", "internal"]
# What the registry package carries (dev-docs/GwzCratesIoPlan.md D4). No
# `LICENSE` entry: the SPDX `license` field above is what crates.io reads, and
# the repository's single GPL-2.0-only text is not copied per crate.
# Anchored with a leading `/`, as gwz-core's own list explains.
include = ["/Cargo.toml", "/src/**", "/README.md"]

[lib]
path = "src/lib.rs"

[features]
# Shared conformance suite and contract-faithful fakes for implementations and
# consumers. Enabled only through dev-dependencies; adds no adapter or
# application dependency.
contract-tests = []

[dependencies]
