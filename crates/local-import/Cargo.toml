# Integration crate: pairing, capture, retained imports and push through its
# own narrow `LocalTransport` port. Owner lane X. Allowed first-party
# dependencies: repo-contract, family-model
# (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md §2).
[package]
name = "gwz-local-import"
version = "0.0.3"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "An internal component crate of GWZ's local clone: family import/push orchestration over a narrow local transport port."
repository = "https://github.com/owebeeone/gwz-core"
readme = "README.md"
keywords = ["gwz", "git", "workspace", "internal"]
# What the registry package carries (dev-docs/GwzCratesIoPlan.md D4). No
# `LICENSE` entry: the SPDX `license` field above is what crates.io reads, and
# the repository's single GPL-2.0-only text is not copied per crate.
# Anchored with a leading `/`, as gwz-core's own list explains.
include = ["/Cargo.toml", "/src/**", "/README.md"]

[lib]
path = "src/lib.rs"

[features]
# The recording transport fake for consumers (core Tier B slices).
test-support = []

[dependencies]
gwz-family-model = { path = "../family-model", version = "0.0.3" }
gwz-repo-contract = { path = "../repo-contract", version = "0.0.3" }
