# Integration crate: pairing, capture, retained imports and push through its
# own narrow `LocalTransport` port. Owner lane X. Allowed first-party
# dependencies: repo-contract, family-model
# (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md §2).
[package]
name = "gwz-local-import"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "An internal component crate of GWZ's local clone: family import/push orchestration over a narrow local transport port."
repository = "https://github.com/owebeeone/gwz-core"
readme = "README.md"
keywords = ["gwz", "git", "workspace", "internal"]

[lib]
path = "src/lib.rs"

[features]
# The recording transport fake for consumers (core Tier B slices).
test-support = []

[dependencies]
gwz-family-model = { path = "../family-model" }
gwz-repo-contract = { path = "../repo-contract" }
