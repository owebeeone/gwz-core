# Contract crate: repository observations, typed object ids, the
# `RepoInspector` and bounded `ObjectReader` ports. Owner lane C (I reviews).
# Allowed first-party dependencies: none
# (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md §2).
[package]
name = "gwz-repo-contract"
version = "0.0.8"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "An internal component crate of GWZ's local clone: repository observation contract (no Git implementation)."
repository = "https://github.com/owebeeone/gwz-core"
readme = "README.md"
keywords = ["gwz", "git", "workspace", "internal"]
# What the registry package carries (dev-docs/GwzCratesIoPlan.md D4). No
# `LICENSE` entry: the SPDX `license` field above is what crates.io reads, and
# the repository's single GPL-2.0-only text is not copied per crate.
# Anchored with a leading `/`, as gwz-core's own list explains.
include = ["/Cargo.toml", "/src/**", "/README.md"]

[lib]
path = "src/lib.rs"

[features]
# Conformance suites and in-memory/scripted fakes; dev-dependencies only.
contract-tests = []

[dependencies]
