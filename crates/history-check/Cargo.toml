# Integration crate: bounded history traversal through an injected read-only
# `ObjectReader`; no deletion or fetch. Owner lane H. Allowed first-party
# dependencies: repo-contract (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md §2).
[package]
name = "gwz-history-check"
version = "0.0.7"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "An internal component crate of GWZ's local clone: bounded read-only history preservation check."
repository = "https://github.com/owebeeone/gwz-core"
readme = "README.md"
keywords = ["gwz", "git", "workspace", "internal"]
# What the registry package carries (dev-docs/GwzCratesIoPlan.md D4). No
# `LICENSE` entry: the SPDX `license` field above is what crates.io reads, and
# the repository's single GPL-2.0-only text is not copied per crate.
# Anchored with a leading `/`, as gwz-core's own list explains.
include = ["/Cargo.toml", "/src/**", "/README.md"]

[lib]
path = "src/lib.rs"

[dependencies]
gwz-repo-contract = { path = "../repo-contract", version = "0.0.7" }

[dev-dependencies]
gwz-repo-contract = { path = "../repo-contract", features = ["contract-tests"] }
