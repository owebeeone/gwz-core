# Integration crate: bounded history traversal through an injected read-only
# `ObjectReader`; no deletion or fetch. Owner lane H. Allowed first-party
# dependencies: repo-contract (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md §2).
[package]
name = "gwz-history-check"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "An internal component crate of GWZ: GWZ local clone: bounded read-only history preservation check."
repository = "https://github.com/owebeeone/gwz-core"
readme = "README.md"
keywords = ["gwz", "git", "workspace", "internal"]

[lib]
path = "src/lib.rs"

[dependencies]
gwz-repo-contract = { path = "../repo-contract" }

[dev-dependencies]
gwz-repo-contract = { path = "../repo-contract", features = ["contract-tests"] }
