# Implementation crate: local Git/filesystem reads implement the repository
# contracts. Owner lane I. Allowed first-party dependencies: repo-contract
# (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md §2). `git2` is the
# inventoried third-party dependency for this package; the lane owner declared
# it (and the dev-only `tempfile`) with the W2 allowlist so no feature lane
# races on the workspace lock.
[package]
name = "gwz-repo-inspect"
version = "0.0.3"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "An internal component crate of GWZ's local clone: local repository inspection (RepoInspector/ObjectReader implementation)."
repository = "https://github.com/owebeeone/gwz-core"
readme = "README.md"
keywords = ["gwz", "git", "workspace", "internal"]
# What the registry package carries (dev-docs/GwzCratesIoPlan.md D4). No
# `LICENSE` entry: the SPDX `license` field above is what crates.io reads, and
# the repository's single GPL-2.0-only text is not copied per crate.
# Anchored with a leading `/`, as gwz-core's own list explains.
include = ["/Cargo.toml", "/src/**", "/README.md"]

[lib]
path = "src/lib.rs"

[dependencies]
gwz-repo-contract = { path = "../repo-contract", version = "0.0.3" }
git2 = { version = "0.21", default-features = false, features = ["unstable-sha256"] }

[dev-dependencies]
gwz-repo-contract = { path = "../repo-contract", features = ["contract-tests"] }
tempfile = "3"

