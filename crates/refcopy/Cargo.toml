# Implementation crate: native/ordinary `SystemTreeCopier` implements
# `TreeCopier`. Owner lane R. Allowed first-party dependencies: copy-contract
# (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md §2). Third-party and
# platform dependencies go through the inventory in
# scripts/checks/local_clone_inventory.json; the lane owner declared them with
# the W2 allowlist (versions matching gwz-core's own manifest) so no feature
# lane races on the workspace lock. `rustix` is the safe-wrapped route to
# clonefile/FICLONE; `libc` and `windows-sys` are there if a raw call is
# unavoidable.
[package]
name = "gwz-refcopy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "GWZ local clone: native copy-on-write with ordinary fallback (TreeCopier implementation)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
gwz-copy-contract = { path = "../copy-contract" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# `Win32_System_IO` is `DeviceIoControl`, `Win32_System_Ioctl` is
# `FSCTL_DUPLICATE_EXTENTS_TO_FILE` with its `DUPLICATE_EXTENTS_DATA` and
# `FSCTL_SET_SPARSE`, and `Win32_System_SystemServices` is the one volume flag
# (`FILE_SUPPORTS_BLOCK_REFCOUNTING`) that says whether a volume can share
# blocks at all. Feature names only: the crate itself is already inventoried.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemServices",
] }

[dev-dependencies]
gwz-copy-contract = { path = "../copy-contract", features = ["contract-tests"] }
tempfile = "3"

