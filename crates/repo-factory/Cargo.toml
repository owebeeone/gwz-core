# Integration crate: bare/clean construction through its own repository-builder
# port. Owner lane B. Allowed first-party dependencies: repo-contract
# (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md §2).
[package]
name = "gwz-repo-factory"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "An internal component crate of GWZ: GWZ local clone: independent bare/clean repository construction."
repository = "https://github.com/owebeeone/gwz-core"
readme = "README.md"
keywords = ["gwz", "git", "workspace", "internal"]

[lib]
path = "src/lib.rs"

[features]
# The recording build-port fake for consumers (core Tier B slices).
test-support = []

[dependencies]
gwz-repo-contract = { path = "../repo-contract" }

[dev-dependencies]
gwz-repo-contract = { path = "../repo-contract", features = ["contract-tests"] }
