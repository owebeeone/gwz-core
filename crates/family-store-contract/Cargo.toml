# Contract crate: family read view, lock session and family metadata
# mutations. Owner lane C (S reviews). Allowed first-party dependencies:
# family-model (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md §2).
[package]
name = "gwz-family-store-contract"
version = "0.0.3"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "An internal component crate of GWZ's local clone: family store contract (read view, locked session, metadata effects)."
repository = "https://github.com/owebeeone/gwz-core"
readme = "README.md"
keywords = ["gwz", "git", "workspace", "internal"]
# What the registry package carries (dev-docs/GwzCratesIoPlan.md D4). No
# `LICENSE` entry: the SPDX `license` field above is what crates.io reads, and
# the repository's single GPL-2.0-only text is not copied per crate.
# Anchored with a leading `/`, as gwz-core's own list explains.
include = ["/Cargo.toml", "/src/**", "/README.md"]

[lib]
path = "src/lib.rs"

[features]
# Store conformance suite and the in-memory fake; dev-dependencies only.
contract-tests = []

[dependencies]
gwz-family-model = { path = "../family-model", version = "0.0.3" }
