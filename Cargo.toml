[package]
name = "gwz-core"
version = "0.14.0"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.95"
repository = "https://github.com/owebeeone/gwz-core"

[lib]
path = "src/lib.rs"

[dependencies]
# Local clone family libraries (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md
# §2). Core is the composition root: it depends on every functional library so
# each is a member of both the outer gwz-dev workspace and a standalone core
# checkout (`cargo test -p <name> --lib` works from either), and it registers
# no library as a workspace of its own. None of them may depend on gwz-core;
# `scripts/checks/check_local_clone_boundaries.py` enforces the edges.
gwz-copy-contract = { path = "crates/copy-contract" }
gwz-family-model = { path = "crates/family-model" }
gwz-family-store = { path = "crates/family-store" }
gwz-family-store-contract = { path = "crates/family-store-contract" }
gwz-history-check = { path = "crates/history-check" }
gwz-local-disposal = { path = "crates/local-disposal" }
gwz-local-import = { path = "crates/local-import" }
gwz-refcopy = { path = "crates/refcopy" }
gwz-repo-contract = { path = "crates/repo-contract" }
gwz-repo-factory = { path = "crates/repo-factory" }
gwz-repo-inspect = { path = "crates/repo-inspect" }
gwz-work-detector = { path = "crates/work-detector" }
gwz-workspace-install = { path = "crates/workspace-install" }
cap-fs-ext = "4"
cap-std = "4"
git2 = { version = "0.21", features = ["https", "ssh", "unstable-sha256"] }
taut-shape = { git = "https://github.com/owebeeone/taut-shape-rs", rev = "7fd171b737f25cb6c356845eb68164d35326ffb0", package = "taut-shape" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
yaml-rust2 = { version = "0.11", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
url = "2"
getrandom = "0.3"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
