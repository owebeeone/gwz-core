[package]
name = "gwz-core"
version = "1.0.18"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.95"
repository = "https://github.com/owebeeone/gwz-core"
description = "Core library and wire protocol of GWZ, the Git workspace zone: one root repository coordinating registered member repositories, with local clone families for parallel work."
readme = "README.md"
keywords = ["git", "workspace", "monorepo", "gwz"]
categories = ["development-tools"]
# What the registry package carries (dev-docs/GwzCratesIoPlan.md D4): only what
# a downstream build needs. `build.rs` reaches `build_support/provenance.rs` by
# path and digests `protocol/gwz.taut.py` when it is present, so both must be
# inside the package. Tests, dev-docs, docs, scripts, the protocol corpus and
# the evidence files stay in git: a registry build reports
# `revision=unavailable` with a digest of the packaged sources, which is the
# honest answer for a package that is not its own repository.
# Every pattern is anchored with a leading `/`: an `include` list is matched
# gitignore-style and overrides `.gitignore`, so an unanchored `README.md`
# would also carry `docs/README.md`, `scripts/*/README.md` and the untracked
# `.pytest_cache/README.md`, and an unanchored `LICENSE` the one inside
# `protocol/.regen-venv/`.
include = [
  "/Cargo.toml",
  "/build.rs",
  "/build_support/**",
  "/src/**",
  "/protocol/gwz.taut.py",
  "/LICENSE",
  "/README.md",
]

[lib]
path = "src/lib.rs"

# Workspace layout Option A (operator ruling 2026-09-05; gwz-dev
# dev-docs/GwzLocalCloneDesign.md revision 9 §11 item 14,
# GwzLocalCloneLibraryBoundaries.md §5/§6 revision 2; landed by LCM1.0c
# follow-up 2). gwz-core is its own Cargo workspace whose members are the
# local clone family libraries under crates/, so a standalone core checkout
# and the outer gwz-dev workspace run the same Tier A command,
# `cargo test -p <name> --lib --locked` from this directory, against this
# directory's committed Cargo.lock. The outer gwz-dev workspace excludes
# gwz-core exactly as it excludes taut-shape-rs; gwz-cli still reaches
# gwz-core through its path dependency. No library declares a `[workspace]`
# table of its own (the local-clone boundary gate refuses one).
[workspace]
resolver = "2"
members = ["crates/*"]

[dependencies]
# Local clone family libraries (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md
# §2). Core is the composition root: it depends on every functional library, and
# every library is a member of this workspace (above), so `cargo test -p <name>
# --lib --locked` works from a standalone core checkout and from the outer
# gwz-dev workspace alike. None of them may depend on gwz-core;
# `scripts/checks/check_local_clone_boundaries.py` enforces the edges.
gwz-copy-contract = { path = "crates/copy-contract", version = "0.0.9" }
gwz-family-model = { path = "crates/family-model", version = "0.0.9" }
gwz-family-store = { path = "crates/family-store", version = "0.0.9" }
gwz-family-store-contract = { path = "crates/family-store-contract", version = "0.0.9" }
gwz-history-check = { path = "crates/history-check", version = "0.0.9" }
gwz-local-disposal = { path = "crates/local-disposal", version = "0.0.9" }
gwz-local-import = { path = "crates/local-import", version = "0.0.9" }
gwz-refcopy = { path = "crates/refcopy", version = "0.0.9" }
gwz-repo-contract = { path = "crates/repo-contract", version = "0.0.9" }
gwz-repo-factory = { path = "crates/repo-factory", version = "0.0.9" }
gwz-repo-inspect = { path = "crates/repo-inspect", version = "0.0.9" }
gwz-work-detector = { path = "crates/work-detector", version = "0.0.9" }
gwz-workspace-install = { path = "crates/workspace-install", version = "0.0.9" }
# The core session crate map's ordinary crates (gwz-dev dev-docs/GwzCoreSessionCrateMap.md
# §2), under the same library boundaries and the same gate.
gwz-ids = { path = "crates/ids", version = "0.0.9" }
# Steps 3 and 4 (map §6): the channel's contract and its in-process adapter,
# which `open` wires, and the session host's gates, limits and supervisor.
gwz-session-channel = { path = "crates/session-channel", version = "0.0.9" }
gwz-session-contract = { path = "crates/session-contract", version = "0.0.9" }
gwz-session-host = { path = "crates/session-host", version = "0.0.9" }
cap-fs-ext = "4"
cap-std = "4"
cfg-if = "1"
# Single-repository Git behaviour (GwzGitLibraryApi.md). Beside gwz-core like git2-rs; the same fork backs both, so
# there is one libgit2 in the build. Step 5.2 (G9, G1) moves error translation, `is_repository` and native commit/tag there.
gwz-git = { path = "../gwz-git" }
# `vendored-libgit2` links the fork's own libgit2, which carries the local-fetch
# correction the family import now relies on alone (no `git fetch` fallback).
# Without it, the fork's build script links a system `libgit2-experimental`
# (a SHA-256 build, since `unstable-sha256` is on) in [1.9.7, 1.10.0) whenever
# pkg-config finds one; `LIBGIT2_NO_VENDOR=1` stays the explicit opt-out
# (tests/native_libgit2.rs).
git2 = { package = "gwz-git2", path = "../git2-rs", version = "=0.21.0", features = ["https", "ssh", "unstable-sha256", "vendored-libgit2"] }
taut-shape = "0.10.0"
# The transport owner's conversation types (`Envelope`, `Scheme`, `AuthPolicy`, `Limits`, ...) and its taut runtime. The protocol
# carries them (`RequestMeta.transport_message`, the `transport_capabilities` extras), so every build links the crate, which
# has no dependency, no I/O and no unsafe code (plan step 2.2); the transport build adds the dependencies that do the I/O below.
gwz-transport = { path = "../gwz-transport" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
yaml-rust2 = { version = "0.11", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
url = "2"
getrandom = "0.3"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# `agent_auth` hands libssh2 its signature buffer from the C runtime's `malloc` (plan step 3.4).
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
# src/git/regular_file.rs creates a named pipe in a test, to show that a pipe handle is not a regular file. (The
# transport build names its own further features below, behind the switch.)
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Credentials", "Win32_System_Pipes"] }

# The transport build (dev-docs/GwzV110RemainingPlan.md C1; GwzV110Plan.md S7.1). Until S7.1 removes the switch, the
# transport's crates are in the resolve only when the build turns `gwz_transport_candidate` on with
# RUSTFLAGS='--cfg gwz_transport_candidate': Cargo evaluates a `[target.'cfg(..)']` key against `rustc --print cfg`, which
# lists the `--cfg` values of RUSTFLAGS, so an ordinary build resolves exactly the dependencies above and the candidate
# build adds the ones below. Cargo.lock names all of them (a lock resolves every target), and every build uses the one
# lock. Cargo reads the manifest of a path dependency whatever the condition, so gwz-transport and gwz-sspi are
# checked out beside gwz-core as git2-rs is. tests/transport_backend/prepare.py used to write these tables into a copy
# of this manifest; its remaining job is described there.
[target.'cfg(gwz_transport_candidate)'.dependencies]
gwz-connection = { path = "../gwz-transport/crates/gwz-connection" }
gwz-sspi = { path = "../gwz-sspi" }
base64 = "=0.22.1"
socket2 = "=0.6.4"
ssh2 = "=0.9.6"
libssh2-sys = "=0.3.3"
tokio = { version = "=1.53.1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "process", "io-util"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
hyper = { version = "=1.11.1", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.11.1"
# The SSH reuse proof's signature check (plan step 1.6; dev-docs/GwzConnectionReuseDesign.md §4 and C9): a connection
# last used by another binding is leased only after the agent's signature over a fresh nonce verifies against the key the
# connection authenticated with. ring verifies Ed25519, ECDSA P-256 and P-384, and RSA (2048 to 8192 bits) PKCS#1 with
# SHA-512; it is the version the test fixtures' rustls already builds on all three platforms. A key it cannot check
# (P-521, DSA, a shorter RSA key) proves nothing, and its connection is never reused across bindings.
ring = "=0.17.14"

[target.'cfg(gwz_transport_candidate)'.dev-dependencies]
pyo3 = { version = "=0.28.3", features = ["auto-initialize"] }
# The HTTPS test fixture's TLS servers are rustls over the ring provider (pure Rust apart from ring's own assembly): a
# native-tls server loads its identity from the platform key store, which Windows denies under a key-based OpenSSH logon
# (step 0.5b). Test-only; the product's TLS stays the platform's (below).
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
# The test-controlled SSH server (src/git/endpoint/ssh_controlled_server): pure Rust over the same ring.
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }

# The `windows-sys` features the transport's code needs beyond the production list above; Cargo unifies this entry with
# that one when both conditions hold. A step that needs one more Windows API adds a name here
# (GwzTransportWindowsParityPlan.md, section 4). They serve product code and test fixtures:
#   product (step 4.2's helper process owner, `https_auth/process_tree/windows*`): Win32_System_JobObjects (the job),
#     Win32_System_Threading (CreateProcessW, the attribute list, process waits), Win32_System_Pipes (the overlapped
#     pipes), Win32_Security (inheritable handle attributes), Win32_System_SystemInformation (the Windows directory), and
#     the production list's own Win32_Foundation and Win32_Storage_FileSystem; Win32_Networking_WinHttp and
#     Win32_Networking_WinSock serve the HTTPS and SSH code; step 4.6's machine proxy lists the interface addresses with
#     Win32_NetworkManagement_IpHelper (GetAdaptersAddresses, whose records need Win32_NetworkManagement_Ndis); step 3.5's
#     Pageant exchange (`pageant_exchange/sys.rs`) needs Win32_Security_Authorization, Win32_System_DataExchange,
#     Win32_System_Memory and Win32_UI_WindowsAndMessaging, and step 3.3's agent pipe (`agent_pipe.rs`) needs
#     Win32_System_IO (overlapped I/O: `CancelIoEx`, `GetOverlappedResult`) beside the Pipes, Threading and FileSystem ones.
#     The switch's removal must carry every one of them into the `windows-sys` list above.
#   test only: Win32_Graphics_Gdi, for `RegisterClassW` (step 3.6's synthetic Pageant makes a window of the class
#     `Pageant`, as the real one does, so that the probe's `FindWindowW` finds it); Win32_System_Diagnostics_ToolHelp and
#     Win32_System_Ioctl, for the Job Object, thread suspension and process lists of the SSH test servers and their native
#     helper (`fixture_job.rs`), a named pipe in the regular-file test, pipe reads and writes in the agent fixture, and the
#     directory junction of the URL tests; Win32_Security_Authentication_Identity and Win32_Security_Credentials, for the
#     SSPI acceptor of step 4.8's real-SSPI rows (`native/tests/real_sspi.rs`). They sit in this normal table as well as
#     in the Windows dev-dependencies above, because `cargo check --lib --profile test`, which
#     scripts/windows_lane_check.py runs, does not enable dev-dependency features.
[target.'cfg(all(windows, gwz_transport_candidate))'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# The HTTPS client's TLS stack is per platform (src/git/endpoint/https_backend.rs): the platform's own through
# native-tls on macOS and Windows, and OpenSSL through the `openssl` crate directly everywhere else. native-tls would
# parse the system bundle twice to fill a store it then replaces (gwz-core-evidence 2026-10-13-https-fixed-cost-pi), so
# it is not a dependency of the OpenSSL build; its dev-dependency there is the oracle the tests compare the stack's
# ClientHello and channel binding against. `openssl` is the version native-tls and libgit2's openssl-sys already
# resolve to in the lock. openssl-probe 0.1 is the crate git2 runs at its start; the transport resolves OpenSSL's
# default verify paths with it (src/git/endpoint/verify_paths.rs).
[target.'cfg(all(gwz_transport_candidate, any(windows, target_vendor = "apple")))'.dependencies]
native-tls = "=0.2.18"
tokio-native-tls = "=0.3.1"

[target.'cfg(all(gwz_transport_candidate, not(any(windows, target_vendor = "apple"))))'.dependencies]
openssl = "=0.10.81"
openssl-probe = "=0.1.6"

[target.'cfg(all(gwz_transport_candidate, not(any(windows, target_vendor = "apple"))))'.dev-dependencies]
native-tls = "=0.2.18"
tokio-native-tls = "=0.3.1"

[dev-dependencies]
# Round 1 remediation C-P3-4: forcing the Git CLI route (`RoutePolicy::CLI_ONLY`, `Services::with_policy`) is a gwz-git
# test facility; only gwz-core's tests have it, so production gwz-core cannot force a route.
gwz-git = { path = "../gwz-git", features = ["test-support"] }
libgit2-sys = { package = "gwz-libgit2-sys", path = "../git2-rs/libgit2-sys", version = "=0.18.8" }
serde_json = "1"
# LCM1.1 (lane C wiring): the Tier B slices under src/local_clone/tests build
# real temporary workspaces with lane T's dev-only fixture harness. A dev edge
# only -- the boundary gate refuses a normal dependency on a harness package,
# and nothing in src/ outside cfg(test) may name it.
gwz-local-testrepo = { path = "crates/local-testrepo" }
# Step 4 (map §6): the host context's tests watch its supervisor's thread through
# the crate's test hook, which only this dev edge turns on (map §1).
gwz-session-host = { path = "crates/session-host", features = ["test-support"] }

[build-dependencies]
sha2 = "0.10"

# The protocol-heavy test matrices repeatedly parse, validate, and hash durable
# records. In the default unoptimized profile that CPU work dominates the suite;
# level 1 keeps debug assertions and symbols while making routine test cycles
# practical.
[profile.test]
opt-level = 1
