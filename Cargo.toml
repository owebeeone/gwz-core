[package]
name = "gwz-core"
version = "1.0.16"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.95"
repository = "https://github.com/owebeeone/gwz-core"
description = "Core library and wire protocol of GWZ, the Git workspace zone: one root repository coordinating registered member repositories, with local clone families for parallel work."
readme = "README.md"
keywords = ["git", "workspace", "monorepo", "gwz"]
categories = ["development-tools"]
# What the registry package carries (dev-docs/GwzCratesIoPlan.md D4): only what
# a downstream build needs. `build.rs` reaches `build_support/provenance.rs` by
# path and digests `protocol/gwz.taut.py` when it is present, so both must be
# inside the package. Tests, dev-docs, docs, scripts, the protocol corpus and
# the evidence files stay in git: a registry build reports
# `revision=unavailable` with a digest of the packaged sources, which is the
# honest answer for a package that is not its own repository.
# Every pattern is anchored with a leading `/`: an `include` list is matched
# gitignore-style and overrides `.gitignore`, so an unanchored `README.md`
# would also carry `docs/README.md`, `scripts/*/README.md` and the untracked
# `.pytest_cache/README.md`, and an unanchored `LICENSE` the one inside
# `protocol/.regen-venv/`.
include = [
  "/Cargo.toml",
  "/build.rs",
  "/build_support/**",
  "/src/**",
  "/protocol/gwz.taut.py",
  "/LICENSE",
  "/README.md",
]

[lib]
path = "src/lib.rs"

# Workspace layout Option A (operator ruling 2026-09-05; gwz-dev
# dev-docs/GwzLocalCloneDesign.md revision 9 §11 item 14,
# GwzLocalCloneLibraryBoundaries.md §5/§6 revision 2; landed by LCM1.0c
# follow-up 2). gwz-core is its own Cargo workspace whose members are the
# local clone family libraries under crates/, so a standalone core checkout
# and the outer gwz-dev workspace run the same Tier A command,
# `cargo test -p <name> --lib --locked` from this directory, against this
# directory's committed Cargo.lock. The outer gwz-dev workspace excludes
# gwz-core exactly as it excludes taut-shape-rs; gwz-cli still reaches
# gwz-core through its path dependency. No library declares a `[workspace]`
# table of its own (the local-clone boundary gate refuses one).
[workspace]
resolver = "2"
members = ["crates/*"]

[dependencies]
# Local clone family libraries (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md
# §2). Core is the composition root: it depends on every functional library, and
# every library is a member of this workspace (above), so `cargo test -p <name>
# --lib --locked` works from a standalone core checkout and from the outer
# gwz-dev workspace alike. None of them may depend on gwz-core;
# `scripts/checks/check_local_clone_boundaries.py` enforces the edges.
gwz-copy-contract = { path = "crates/copy-contract", version = "0.0.7" }
gwz-family-model = { path = "crates/family-model", version = "0.0.7" }
gwz-family-store = { path = "crates/family-store", version = "0.0.7" }
gwz-family-store-contract = { path = "crates/family-store-contract", version = "0.0.7" }
gwz-history-check = { path = "crates/history-check", version = "0.0.7" }
gwz-local-disposal = { path = "crates/local-disposal", version = "0.0.7" }
gwz-local-import = { path = "crates/local-import", version = "0.0.7" }
gwz-refcopy = { path = "crates/refcopy", version = "0.0.7" }
gwz-repo-contract = { path = "crates/repo-contract", version = "0.0.7" }
gwz-repo-factory = { path = "crates/repo-factory", version = "0.0.7" }
gwz-repo-inspect = { path = "crates/repo-inspect", version = "0.0.7" }
gwz-work-detector = { path = "crates/work-detector", version = "0.0.7" }
gwz-workspace-install = { path = "crates/workspace-install", version = "0.0.7" }
cap-fs-ext = "4"
cap-std = "4"
cfg-if = "1"
git2 = { version = "0.21", features = ["https", "ssh", "unstable-sha256"] }
taut-shape = "0.9.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
yaml-rust2 = { version = "0.11", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
url = "2"
getrandom = "0.3"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
libgit2-sys = "=0.18.8"
serde_json = "1"
# LCM1.1 (lane C wiring): the Tier B slices under src/local_clone/tests build
# real temporary workspaces with lane T's dev-only fixture harness. A dev edge
# only -- the boundary gate refuses a normal dependency on a harness package,
# and nothing in src/ outside cfg(test) may name it.
gwz-local-testrepo = { path = "crates/local-testrepo" }

[build-dependencies]
sha2 = "0.10"

# The protocol-heavy test matrices repeatedly parse, validate, and hash durable
# records. In the default unoptimized profile that CPU work dominates the suite;
# level 1 keeps debug assertions and symbols while making routine test cycles
# practical.
[profile.test]
opt-level = 1
