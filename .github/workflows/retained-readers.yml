# Retained merge readers.
#
# M5d, 2026-09-05. The five-platform old-binary matrix job is RETIRED
# (operator: "move on from v0.13"). It downloaded released v0.9.2/v0.10.2
# binaries over the network on five runners, ran them against generated
# fixtures, and compared the macOS arm64 result against the checked-in
# evidence. What survives is the offline half: the input validation and the
# harness's own unit tests, which need no network, no old binary and no
# runner matrix beyond ubuntu/windows. The matrix driver, the evidence
# comparer and the checked evidence stay in the tree and stay unit-tested;
# nothing schedules them.
name: Retained merge readers

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
  # The remaining job reads only these. It no longer passes `--core` to the
  # predicate checker and no longer runs a released binary, so `src/**`,
  # `protocol/**` and the two merge design/plan documents are not inputs to
  # anything this workflow does.
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/retained-readers.yml"
      - "dev-docs/GwzM5-8I2CompatibilityPredicates.json"
      - "scripts/checks/**"
      - "scripts/retained_readers/**"
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - ".github/workflows/retained-readers.yml"
      - "dev-docs/GwzM5-8I2CompatibilityPredicates.json"
      - "scripts/checks/**"
      - "scripts/retained_readers/**"

jobs:
  harness:
    name: Harness unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Test and validate retained-reader inputs
        shell: bash
        run: |
          python scripts/checks/check_merge_compatibility_predicates.py \
            dev-docs/GwzM5-8I2CompatibilityPredicates.json
          python -m unittest scripts/checks/test_merge_compatibility_predicates.py -v
          python -m unittest discover -s scripts/retained_readers -p 'test_*.py' -v
          python scripts/retained_readers/retained_reader_harness.py validate scripts/retained_readers/manifest.json
          python scripts/retained_readers/retained_reader_harness.py gate-ready scripts/retained_readers/manifest.json
