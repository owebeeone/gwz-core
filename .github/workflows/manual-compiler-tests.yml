name: Architecture compiler probes (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAUT_PYTHON: python
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0
          python -m pip install taut-proto==0.9.1
      - name: Run compiler-mutation probes
        run: python scripts/run_compiler_tests.py
