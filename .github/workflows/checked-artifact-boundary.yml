name: Checked-artifact boundary

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  boundary:
    name: Structural boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Per-commit lane gate over the pushed range
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: bash scripts/checks/check_lane_commits.sh "${{ github.event.before }}" "${{ github.sha }}"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0
      - name: Check complete entry and call graph
        run: |
          python scripts/checks/check_checked_artifact_boundaries.py
          python -m unittest scripts/checks/test_check_checked_artifact_boundaries.py -v
          python -m unittest scripts/checks/test_release_boundary.py -v
          CLIPPY_CONF_DIR="$PWD" cargo clippy --all-targets --all-features -- -D warnings
      - name: Run the M5b structural tripwire scans on every push
        # M5b State [P2-1] / Code P3: the T-3/T-4 source-surface scans must
        # execute in the push lane, not only under full cargo-test runs.
        run: cargo test --lib workspace_ops::merge::v1_lifecycle::tests::no_ff_wire
      - name: Run the gates A1 made load-bearing
        # A1 Safety [P2-2] / §6.2. Before A1 these R4b-G tools were
        # bookkeeping and ran nowhere; the activation turned them into standing
        # guards. The privacy probe plus the call-graph gate are the
        # "standing guard" the J-1 acceptance leaned on — a guard that runs
        # nowhere stands only on prose. Driven through the aggregate runner so
        # each battery's expected count is pinned, not just its exit code.
        run: |
          python scripts/checks/run_r4bg_aggregate_gates.py privacy call-graph
  local-clone-boundary:
    # LCM1.0c (gwz-dev dev-docs/GwzLocalCloneLibraryBoundaries.md §6): the
    # local clone family's package classification and declared-edge gate,
    # its negative fixtures, and each library's Tier A command from a
    # standalone core checkout (this runner is exactly that checkout).
    name: Local clone library boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0
      - name: Classification and dependency-edge gate
        run: |
          python scripts/checks/check_local_clone_boundaries.py
          python -m unittest scripts/checks/test_check_local_clone_boundaries.py -v
      - name: Bazel pin-drift gate, its unit tests and negative fixtures
        # LCM1.0c follow-up 4 (lane C, 2026-09-06). Under workspace layout
        # Option A the outer gwz-dev workspace's Bazel hub for gwz-cli
        # (`@crates`, MODULE.bazel) is `from_specs` with the three direct
        # crates.io dependencies pinned BY HAND to //:Cargo.lock;
        # `check_bazel_pin_drift.py` refuses when a version, a feature set
        # or the dependency set drifts. Its inputs are the gwz-dev ROOT's
        # MODULE.bazel and Cargo.lock plus gwz-cli/Cargo.toml -- none of
        # which exists on this single-repo checkout -- so the LIVE check
        # cannot resolve here (the same blocker class as L2-05 below) and
        # runs in the landing gate set from the gwz-dev root, where its
        # inputs are; it is deliberately not guarded by a file-exists test,
        # because a gate that passes when its inputs are absent is no gate.
        # What runs here is the checker's own suite: every negative fixture
        # (bumped version, changed feature, added and removed dependency,
        # inexact pin, unscoped spec, BUILD label drift, missing input) is
        # synthetic, and the real-tree row skips naming its reason.
        run: python -m unittest scripts/checks/test_check_bazel_pin_drift.py -v
      - name: Each library's Tier A command, locked against gwz-core's workspace lock
        # Workspace layout Option A (LCM1.0c follow-up 2; operator ruling
        # 2026-09-05, gwz-dev dev-docs/GwzLocalCloneDesign.md §11 item 14,
        # GwzLocalCloneLibraryBoundaries.md §5/§6 revision 2): gwz-core is
        # its own Cargo workspace whose members are the libraries under
        # crates/, so this standalone checkout and the outer gwz-dev workspace
        # run one and the same command against the committed gwz-core
        # Cargo.lock. `--locked` is therefore restored, which is the S-P3-3
        # guard's recorded retirement condition (LCM1.0c checkpoint §7.6).
        # The package list is the inventory's present packages, so a lane
        # flipping `expected` to `present` is covered without editing this
        # file; an empty list is a failure, never a silent pass.
        run: |
          names="$(python scripts/checks/check_local_clone_boundaries.py --list-present)"
          test -n "$names"
          for name in $names; do
            cargo test -p "$name" --lib --locked
            # LCM1.0c-rem1 optional ride-along: the root job clippies gwz-core
            # only, so lint each library here too.
            cargo clippy -p "$name" --all-targets --locked -- -D warnings
          done
      - name: Foreign-target clippy of the platform tables (x86_64-pc-windows-msvc)
        # LCM1.0c follow-up 3 (deliverable C). Lane R's native wrappers and
        # every `cfg(windows)` arm otherwise compile only on the dispatch-only
        # Windows matrix, so they can rot between dispatches; this checks them
        # on every push for the crates whose declared closure builds no native
        # code (`git2` needs the target's C toolchain -- the checker lists the
        # rest). The Linux target is this runner's host, covered by the loop
        # above. This is the check that caught `clippy::result_large_err` on
        # `CopyError`, 128 bytes on Windows.
        run: |
          rustup target add x86_64-pc-windows-msvc
          names="$(python scripts/checks/check_local_clone_boundaries.py --list-cross-checkable)"
          test -n "$names"
          for name in $names; do
            cargo clippy -p "$name" --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
          done
      # check_m4_scenario_map.py is NOT wired here — corrective un-wiring
      # 2026-08-25 after the landing-commit run (32749441874) failed on it:
      # its MAP_DOC resolves `dev-docs/GwzM5-8R4bG-Evidence.md` ONE LEVEL
      # ABOVE this checkout by design (check_m4_scenario_map.py:59 —
      # ROOT.parent), i.e. the development workspace root, which does not
      # exist on a single-repo runner. Same blocker class as L2-05 below,
      # same cure (the multi-repo checkout of the R2-D settled tuple §11.3
      # item 7, R2-F CI work); until then it stays a local/release-lane
      # gate, executed in every landing gate set. Activation record §17.
      # L2-05 (`check_merge_docs.py` / `test_check_merge_docs.py`) is NOT wired
      # here, deliberately. Its manifest asserts against `gwz-cli/docs/*` and
      # `dev-docs/*` resolved from the development workspace root
      # (`scripts/checks/check_merge_docs.py` DEFAULT_WORKSPACE_ROOT =
      # parents[3]), and this job checks out gwz-core alone — the sibling
      # gwz-cli tree the manifest names does not exist on the runner, so the
      # checker cannot resolve a single document path. Wiring it needs the
      # multi-repo checkout described by the R2-D settled tuple §11.3 item 7;
      # until then it stays a local/release-lane gate. A1 Safety [P2-2].
