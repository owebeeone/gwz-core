name: Checked-artifact boundary

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  boundary:
    name: Structural boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0
      - name: Check complete entry and call graph
        run: |
          python scripts/checks/check_checked_artifact_boundaries.py
          python -m unittest scripts/checks/test_check_checked_artifact_boundaries.py -v
          CLIPPY_CONF_DIR="$PWD" cargo clippy --all-targets --all-features -- -D warnings
