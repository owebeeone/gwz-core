name: Windows matrix

permissions:
  contents: read

on:
  workflow_dispatch:

# PROBE BRANCH ONLY: trimmed to the CRLF environment diagnostic for the
# exact-evidence investigation (dev-docs/GwzWindowsMatrix-ExactEvidenceDiagnosis.md).
# The full-suite workflow lives on main.
jobs:
  matrix:
    name: Environment probe (CRLF preconditions)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Probe git CRLF configuration
        shell: bash
        run: |
          git --version
          echo '== system =='
          git config --show-origin --system --get-all core.autocrlf || true
          echo '== global =='
          git config --show-origin --global --get-all core.autocrlf || true
          echo '== effective (repo) =='
          git config --show-origin --get-all core.autocrlf || true
          echo '== all line-ending/filter config =='
          git config --list --show-origin | grep -iE 'autocrlf|eol|safecrlf|filter' || true
