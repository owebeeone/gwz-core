name: Windows matrix

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  matrix:
    name: Full suite on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install taut-proto
        # The protocol-currency tests regenerate via the taut generator;
        # mirror release.yml's pinned install so Windows keeps that signal.
        run: python -m pip install --upgrade pip "taut-proto==0.8.1"
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # The suite step exits red while the burn-down tail exists; still
          # save the cache so later runs and probe branches start warm.
          cache-on-failure: true
      # PROBE BRANCH ONLY (probe/anchor-retirement-win, R2-D Phase 4 Step 4.2).
      # Trimmed to the suites that drive the retired durability anchor: the
      # closed protocol itself, the seven legacy AnchoredPrivateArea call sites
      # (cleanup.rs x3, residue.rs x3, transition.rs x1) exercised by the legacy
      # checked-artifact suites, the seam pins, and the ExactInterior arm the
      # E10/E14 annotation governs. Never merge this trim to main.
      - name: Run the anchor-retirement probe slice
        shell: bash
        run: |
          set -o pipefail
          : > windows-matrix.log
          status=0
          for filter in \
            checked_artifact::platform \
            checked_artifact::tests \
            checked_artifact::interface_tests::capability_permit \
            checked_artifact::namespace::tests_fault_matrix \
            checked_artifact::namespace::tests_managed_matrix \
            checked_artifact::capability::pre_catalog::provider::tests_authority_record ; do
            echo "== $filter ==" | tee -a windows-matrix.log
            cargo test --locked --lib "$filter" -- --test-threads=1 2>&1 | tee -a windows-matrix.log || status=1
          done
          echo "probe slice status=$status"
      - name: Summarize failures
        shell: bash
        run: |
          echo '== failure names =='
          grep -E '^test .* \.\.\. FAILED' windows-matrix.log | sort || true
          echo '== results =='
          grep -E '^test result' windows-matrix.log
          if grep -qE '^test result: FAILED' windows-matrix.log; then exit 1; fi
