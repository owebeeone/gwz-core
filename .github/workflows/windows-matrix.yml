name: Windows matrix

permissions:
  contents: read

on:
  workflow_dispatch:

# PROBE BRANCH ONLY: trimmed to the single surviving matrix failure with the
# resolver's discarded cause propagated into the reject message
# (finalization_root diagnosis; see GwzWindowsMatrix-Classification.md run 10).
# The full-suite workflow lives on main.
jobs:
  matrix:
    name: Finalization-root diagnosis (single test)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run the surviving test with full output
        shell: bash
        run: cargo test --locked --lib workspace_ops::merge::v1_lifecycle::finalization::root_tests::unborn_publication_uses_the_exact_checked_first_commit_candidate -- --nocapture 2>&1 | tee windows-matrix.log || true
      - name: Show result
        shell: bash
        run: |
          grep -E '^test result' windows-matrix.log
          if grep -qE '^test result: FAILED' windows-matrix.log; then exit 1; fi
