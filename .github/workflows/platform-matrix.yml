name: Platform matrix

permissions:
  contents: read

on:
  workflow_dispatch:

# PROBE BRANCH ONLY: trimmed to the g15 root_preservation suite on the Linux
# leg with the test-only per-gate dump enabled, to name which of the four
# `prepare_root_preservation_stash` gates is false on the real runner and on
# which field (GwzArmPreservationHandoffDiagnosis.md, "Prescribed probe").
# The full-suite, two-platform workflow lives on main.
jobs:
  matrix:
    name: g15 preservation-handoff gate dump (Linux ARM)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run the g15 root_preservation suite with the gate dump
        shell: bash
        run: |
          cargo test --locked --lib git::tests::g15::root_preservation \
            -- --nocapture 2>&1 | tee platform-matrix.log || true
      - name: Gate dump
        shell: bash
        run: grep -F 'PROBE-G15' platform-matrix.log || echo 'no gate dump emitted'
      - name: Summarize failures
        shell: bash
        run: |
          echo '== failure names =='
          grep -E '^test .* \.\.\. FAILED' platform-matrix.log | sort || true
          echo '== results =='
          grep -E '^test result' platform-matrix.log
          if grep -qE '^test result: FAILED' platform-matrix.log; then exit 1; fi
