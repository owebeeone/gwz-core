name: Platform matrix

permissions:
  contents: read

on:
  workflow_dispatch:

# Dispatch-only full-suite runs for the platforms release.yml does not
# cover (R5 evidence: macOS and Linux ARM64 — GwzM5-8R2F-EvidenceMap.md).
env:
  GWZ_TEST_GIT: real

jobs:
  matrix:
    name: Full suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install taut-proto
        # The protocol-currency tests regenerate via the taut generator;
        # mirror release.yml's pinned install (same fix as windows-matrix).
        run: python -m pip install --upgrade pip "taut-proto==0.9.1"
      - name: Run the complete test suite
        shell: bash
        # gwz-core alone is checked out, so gwz-transport's process-global
        # check is skipped (SKIPPED GATE); the checked-artifact boundary job
        # runs it (GwzCoreSessionDesign §5.7). The conditional-compilation
        # check likewise skips gwz-cli and gwz-py, which no gwz-core job
        # checks out (GwzCoreSessionPlan CS1.7).
        run: python scripts/run_tests.py --skip-transport-globals --skip-cfg-siblings --no-fail-fast 2>&1 | tee platform-matrix.log || true
      - name: Summarize failures
        shell: bash
        run: |
          echo '== failure names =='
          grep -E '^test .* \.\.\. FAILED' platform-matrix.log | sort || true
          echo '== results =='
          grep -E '^test result' platform-matrix.log
          if grep -qE '^test result: FAILED' platform-matrix.log; then exit 1; fi
