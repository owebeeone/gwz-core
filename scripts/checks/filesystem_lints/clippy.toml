# Compiler-resolved writer boundary for merge paths that require checked
# artifact mutation. Entries which are platform- or feature-specific remain
# fail-closed when present and harmless when absent.
disallowed-methods = [
  { path = "gwz_core::filesystem::FileSystem::create_file", reason = "checked merge readers must not bypass mutation authority through FileSystem", allow-invalid = true },
  { path = "gwz_core::filesystem::FileSystem::create_file_at", reason = "checked merge readers must not bypass mutation authority through FileSystem", allow-invalid = true },
  { path = "gwz_core::filesystem::FileSystem::create_directory_at", reason = "checked merge readers must not bypass mutation authority through FileSystem", allow-invalid = true },
  { path = "gwz_core::filesystem::FileSystem::create_directories", reason = "checked merge readers must not bypass mutation authority through FileSystem", allow-invalid = true },
  { path = "gwz_core::filesystem::FileSystem::write_at", reason = "checked merge readers must not bypass mutation authority through FileSystem", allow-invalid = true },
  { path = "gwz_core::filesystem::FileSystem::write_all", reason = "checked merge readers must not bypass mutation authority through FileSystem", allow-invalid = true },
  { path = "gwz_core::filesystem::FileSystem::rename_at", reason = "checked merge readers must not bypass mutation authority through FileSystem", allow-invalid = true },
  { path = "gwz_core::filesystem::FileSystem::rename", reason = "checked merge readers must not bypass mutation authority through FileSystem", allow-invalid = true },
  { path = "gwz_core::filesystem::FileSystem::remove_file", reason = "checked merge readers must not bypass mutation authority through FileSystem", allow-invalid = true },
  { path = "gwz_core::filesystem::FileSystem::remove_file_at", reason = "checked merge readers must not bypass mutation authority through FileSystem", allow-invalid = true },
  { path = "gwz_core::filesystem::FileSystem::remove_directory", reason = "checked merge readers must not bypass mutation authority through FileSystem", allow-invalid = true },
  { path = "gwz_core::filesystem::FileSystem::remove_directory_at", reason = "checked merge readers must not bypass mutation authority through FileSystem", allow-invalid = true },
  { path = "std::fs::read", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::fs::read_to_string", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::fs::read_dir", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::fs::metadata", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::fs::symlink_metadata", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::fs::canonicalize", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::fs::File::open", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::path::Path::exists", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::path::Path::try_exists", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::path::Path::is_file", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::path::Path::is_dir", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::path::Path::is_symlink", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::path::Path::metadata", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::path::Path::symlink_metadata", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::path::Path::canonicalize", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::path::Path::read_dir", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::path::Path::read_link", reason = "host filesystem access belongs behind FileSystem", allow-invalid = true },
  { path = "std::fs::write", reason = "merge artifact writers must use a purpose-specific checked entry" },
  { path = "std::fs::rename", reason = "merge artifact writers must use a purpose-specific checked entry" },
  { path = "std::fs::remove_file", reason = "merge artifact writers must use a purpose-specific checked entry" },
  { path = "std::fs::create_dir", reason = "merge managed parents must use checked bootstrap" },
  { path = "std::fs::create_dir_all", reason = "merge managed parents must use checked bootstrap" },
  { path = "std::fs::File::create", reason = "merge artifact writers must use a purpose-specific checked entry" },
  { path = "std::fs::OpenOptions::open", reason = "merge artifact writers must use a purpose-specific checked entry" },
  { path = "std::io::Write::write", reason = "merge artifact writers must use a purpose-specific checked entry" },
  { path = "std::io::Write::write_all", reason = "merge artifact writers must use a purpose-specific checked entry" },
  { path = "cap_std::fs::Dir::create", reason = "raw capability writes belong only inside checked_artifact", allow-invalid = true },
  { path = "cap_std::fs::Dir::create_dir", reason = "managed parents must use checked bootstrap", allow-invalid = true },
  { path = "cap_std::fs::Dir::remove_file", reason = "raw capability writes belong only inside checked_artifact", allow-invalid = true },
  { path = "cap_std::fs::Dir::rename", reason = "raw capability writes belong only inside checked_artifact", allow-invalid = true },
  { path = "cap_std::fs::Dir::open_with", reason = "raw capability writes belong only inside checked_artifact", allow-invalid = true },
  { path = "git2::Index::write", reason = "merge Git mutation must use the reviewed Git backend", allow-invalid = true },
  { path = "git2::Reference::delete", reason = "merge Git mutation must use the reviewed Git backend", allow-invalid = true },
  { path = "gwz_core::artifact::write_atomic", reason = "checked merge paths must not fall through to ordinary atomic writers", allow-invalid = true },
  { path = "gwz_core::stash::write_bundle", reason = "checked merge paths must not fall through to the ordinary stash writer", allow-invalid = true },
  { path = "gwz_core::workspace_ops::sync_workspace_boundary", reason = "checked merge paths must not fall through to the ordinary boundary writer", allow-invalid = true },
]

# Scoped to migrated modules via deny; native implementation owns these types.
disallowed-types = [
  { path = "std::fs::File", reason = "use opaque FileSystem handles", allow-invalid = true },
  { path = "std::fs::OpenOptions", reason = "use opaque FileSystem handles", allow-invalid = true },
  { path = "std::fs::ReadDir", reason = "use opaque FileSystem handles", allow-invalid = true },
  { path = "std::fs::DirEntry", reason = "use opaque FileSystem handles", allow-invalid = true },
  { path = "cap_std::fs::Dir", reason = "use opaque FileSystem handles", allow-invalid = true },
  { path = "cap_std::fs::File", reason = "use opaque FileSystem handles", allow-invalid = true },
]
